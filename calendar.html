<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Календарь">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Календарь</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --bg-blur: rgba(255,255,255,.78);
    --text: #1c1c1e;
    --muted: #8e8e93;
    --hover: rgba(120,120,128,.12);
    --sep: rgba(60,60,67,.14);
    --sheet: #ffffff;
    --accent: #0a84ff;
    --on-accent: #fff;
    --hh: 0px; /* высота шапки, выставляется скриптом */
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --bg-blur: rgba(0,0,0,.72);
    --text: #ffffff;
    --hover: rgba(120,120,128,.24);
    --sep: rgba(84,84,88,.55);
    --sheet: #1c1c1e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    transition: background .25s, color .25s;
  }
  .wrap {
    max-width: 440px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg-blur);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    backdrop-filter: saturate(180%) blur(22px);
    padding-top: calc(env(safe-area-inset-top) + 10px);
    border-bottom: .5px solid var(--sep);
  }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  .title { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .tools { display: flex; align-items: center; gap: 2px; }
  .tool {
    position: relative; width: 36px; height: 36px; border: 0; padding: 0; border-radius: 50%;
    background: transparent; color: var(--accent);
    display: grid; place-items: center; cursor: pointer; transition: background .15s;
  }
  .tool:hover { background: var(--hover); }
  .tool:active { background: var(--hover); }
  .tool svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tool .moon { display: none; }
  :root[data-theme="dark"] .tool .sun { display: none; }
  :root[data-theme="dark"] .tool .moon { display: block; }
  .swatch i {
    width: 21px; height: 21px; border-radius: 50%; display: block;
    background: var(--accent);
    box-shadow: inset 0 0 0 2px var(--bg), 0 0 0 1.5px var(--sep);
  }
  .swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .week div {
    text-align: center; font-size: 12px; font-weight: 600;
    color: var(--muted); padding: 2px 0 9px; text-transform: uppercase;
  }

  main { padding-bottom: calc(env(safe-area-inset-bottom) + 32px); }
  .month { padding-top: 24px; }
  .month h2 {
    margin: 0 0 8px 6px; font-size: 20px; font-weight: 700;
    letter-spacing: -.01em; text-transform: capitalize;
  }
  .month.current h2 { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
  .day {
    aspect-ratio: 1; border: 0; padding: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 18px; border-radius: 50%;
    cursor: pointer; margin: 0 auto; width: 88%;
    transition: background .15s, transform .12s;
  }
  @media (hover: hover) { .day:hover { background: var(--hover); } }
  .day:active { transform: scale(.9); }
  .day.empty { visibility: hidden; pointer-events: none; }
  .day.today { color: var(--accent); font-weight: 700; }
  .day.marked { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  @media (hover: hover) { .day.marked:hover { background: var(--accent); filter: brightness(1.07); } }

  .overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.32);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s; padding: 24px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 270px; background: var(--sheet);
    border-radius: 16px; text-align: center; overflow: hidden;
    transform: scale(1.08); transition: transform .18s;
  }
  .overlay.show .sheet { transform: scale(1); }
  .sheet p { margin: 0; padding: 20px 16px 18px; font-size: 15px; line-height: 1.35; }
  .sheet p b { display: block; font-size: 17px; margin-bottom: 4px; }
  .sheet .row { display: flex; border-top: .5px solid var(--sep); }
  .sheet button {
    flex: 1; border: 0; background: transparent; font: inherit; font-size: 17px;
    padding: 14px 0; cursor: pointer; color: var(--accent);
  }
  .sheet button:active { background: var(--hover); }
  .sheet button + button { border-left: .5px solid var(--sep); font-weight: 600; color: #ff453a; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="title" id="title"></div>
      <div class="tools">
        <button class="tool" id="theme" aria-label="Тема">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
        <label class="tool swatch" aria-label="Цвет"><i></i><input type="color" id="color"></label>
      </div>
    </div>
    <div class="week" id="week"></div>
  </div>
</header>

<main class="wrap" id="feed"></main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <p><b>Убрать отметку?</b><span id="dlgDate"></span></p>
    <div class="row">
      <button id="cancel">Отмена</button>
      <button id="ok">Убрать</button>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY = 'marked-days-v1';
  const RANGE = 12; // месяцев в каждую сторону

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const pad = n => String(n).padStart(2, '0');
  const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const monthIndex = (y, m) => y * 12 + m;

  const now = new Date();
  const nowIdx = monthIndex(now.getFullYear(), now.getMonth());

  const state = Object.assign({ color: '#0a84ff', days: [] }, load());
  if (typeof state.first !== 'number') { state.first = nowIdx; save(); }
  const marked = new Set(state.days);

  let startIdx = state.first - RANGE;
  for (const k of marked) {
    const [y, m] = k.split('-').map(Number);
    startIdx = Math.min(startIdx, monthIndex(y, m - 1));
  }
  const endIdx = nowIdx + RANGE;

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const feed = $('feed'), title = $('title'), header = document.querySelector('header');
  const colorInput = $('color'), overlay = $('overlay');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const mq = window.matchMedia('(prefers-color-scheme: dark)');

  /* ---------- тема ---------- */
  function applyTheme(t) {
    root.dataset.theme = t;
    themeMeta.setAttribute('content', t === 'dark' ? '#000000' : '#ffffff');
  }
  applyTheme(state.theme || (mq.matches ? 'dark' : 'light'));
  mq.addEventListener?.('change', e => { if (!state.theme) applyTheme(e.matches ? 'dark' : 'light'); });
  $('theme').onclick = () => {
    state.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(state.theme); save();
  };

  /* ---------- цвет ---------- */
  function applyColor(c) {
    root.style.setProperty('--accent', c);
    const h = c.replace('#', '');
    const [R, G, B] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
    const lum = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
    root.style.setProperty('--on-accent', lum > 0.72 ? '#1c1c1e' : '#fff');
    colorInput.value = c;
    makeIcon(c);
  }
  colorInput.addEventListener('input', e => { state.color = e.target.value; applyColor(state.color); save(); });

  // иконка для «На экран Домой» рисуется на лету, цвет — выбранный
  function makeIcon(c) {
    try {
      const cv = document.createElement('canvas'); cv.width = cv.height = 180;
      const x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, 180, 180);
      x.fillStyle = c; x.beginPath(); x.arc(90, 90, 52, 0, Math.PI * 2); x.fill();
      let l = document.querySelector('link[rel="apple-touch-icon"]');
      if (!l) { l = document.createElement('link'); l.rel = 'apple-touch-icon'; document.head.appendChild(l); }
      l.href = cv.toDataURL('image/png');
    } catch {}
  }

  /* ---------- лента ---------- */
  $('week').innerHTML = ['пн','вт','ср','чт','пт','сб','вс'].map(d => `<div>${d}</div>`).join('');
  const fmtMonth = new Intl.DateTimeFormat('ru', { month: 'long' });
  const todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());

  function build() {
    let html = '';
    for (let idx = startIdx; idx <= endIdx; idx++) {
      const y = Math.floor(idx / 12), m = idx % 12;
      const offset = (new Date(y, m, 1).getDay() + 6) % 7;
      const count = new Date(y, m + 1, 0).getDate();
      html += `<section class="month${idx === nowIdx ? ' current' : ''}" data-y="${y}">`;
      html += `<h2>${fmtMonth.format(new Date(y, m, 1))}</h2><div class="grid">`;
      for (let i = 0; i < offset; i++) html += '<button class="day empty" tabindex="-1"></button>';
      for (let d = 1; d <= count; d++) {
        const k = key(y, m, d);
        const cls = ['day', marked.has(k) && 'marked', k === todayKey && 'today'].filter(Boolean).join(' ');
        html += `<button class="${cls}" data-k="${k}">${d}</button>`;
      }
      html += '</div></section>';
    }
    feed.innerHTML = html;
  }

  function updateTitle() {
    const probe = header.offsetHeight + 40;
    let year = Math.floor(startIdx / 12);
    for (const s of feed.children) {
      if (s.getBoundingClientRect().top <= probe) year = s.dataset.y; else break;
    }
    title.textContent = year;
  }
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { updateTitle(); ticking = false; });
  }, { passive: true });

  function scrollToCurrent() {
    const cur = feed.querySelector('.month.current');
    if (!cur) return;
    window.scrollTo(0, cur.getBoundingClientRect().top + window.scrollY - header.offsetHeight);
  }

  /* ---------- отметки ---------- */
  const persist = () => { state.days = [...marked]; save(); };
  let pendingBtn = null;

  feed.addEventListener('click', e => {
    const b = e.target.closest('.day[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    if (marked.has(k)) {
      pendingBtn = b;
      const [y, m, d] = k.split('-').map(Number);
      $('dlgDate').textContent = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d));
      overlay.classList.add('show');
    } else {
      marked.add(k); persist(); b.classList.add('marked');
      if (navigator.vibrate) navigator.vibrate(8);
    }
  });

  const closeDlg = () => { overlay.classList.remove('show'); pendingBtn = null; };
  $('cancel').onclick = closeDlg;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeDlg(); });
  $('ok').onclick = () => {
    if (pendingBtn) { marked.delete(pendingBtn.dataset.k); persist(); pendingBtn.classList.remove('marked'); }
    closeDlg();
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });

  /* ---------- старт ---------- */
  applyColor(state.color);
  build();
  updateTitle();
  scrollToCurrent();
  updateTitle();
})();
</script>
</body>
</html>
